
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSense Copilot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      background: #f2f7ef;
      color: #243b2a;
    }
    h1 { color: #28633b; }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0001;
    }
    label { display: block; margin-top: 14px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 5px;
    }
    button {
      margin-top: 22px;
      padding: 12px 18px;
      background: #28633b;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #results {
      margin-top: 22px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>🌱 AgriSense Copilot</h1>
  <p>Your soil and climate assistant for smarter farming.</p>

  <div class="card">
    <h2>Farm conditions</h2>
    <form id="farmForm">
      <label>Nitrogen (N)
        <input type="number" id="nitrogen" value="80" required>
      </label>
      <label>Phosphorus (P)
        <input type="number" id="phosphorus" value="40" required>
      </label>
      <label>Potassium (K)
        <input type="number" id="potassium" value="40" required>
      </label>
      <label>Temperature (°C)
        <input type="number" id="temperature" value="24" required>
      </label>
      <label>Humidity (%)
        <input type="number" id="humidity" value="65" required>
      </label>
      <label>Soil pH
        <input type="number" id="ph" value="6.5" step="0.1" required>
      </label>
      <label>Rainfall (mm)
        <input type="number" id="rainfall" value="100" required>
      </label>
      <button type="submit">Analyze conditions</button>
    </form>
    <div id="results" aria-live="polite"></div>
  </div>

  <script>
    document.getElementById("farmForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const n = Number(document.getElementById("nitrogen").value);
      const p = Number(document.getElementById("phosphorus").value);
      const k = Number(document.getElementById("potassium").value);
      const temp = Number(document.getElementById("temperature").value);
      const humidity = Number(document.getElementById("humidity").value);
      const ph = Number(document.getElementById("ph").value);
      const rain = Number(document.getElementById("rainfall").value);

      const messages = [];

      messages.push(n < 50 ? "Nitrogen is relatively low." :
        n > 150 ? "Nitrogen is relatively high." :
        "Nitrogen is in the middle range.");

      messages.push(p < 30 ? "Phosphorus is relatively low." :
        "Phosphorus is not low.");

      messages.push(k < 30 ? "Potassium is relatively low." :
        "Potassium is not low.");

      messages.push(temp < 15 ? "Temperature is relatively cool." :
        temp > 30 ? "Temperature is relatively hot." :
        "Temperature is moderate.");

      messages.push(humidity < 40 ? "Humidity is relatively low." :
        "Humidity is not low.");

      messages.push(ph < 5.5 ? "Soil is acidic." :
        ph > 7.5 ? "Soil is alkaline." :
        "Soil pH is in a broadly common range.");

      messages.push(rain < 50 ? "Rainfall is low." :
        "Rainfall is not low.");

      document.getElementById("results").innerHTML =
        "<h3>Condition analysis</h3><ul>" +
        messages.map(message => "<li>" + message + "</li>").join("") +
        "</ul><p><strong>Note:</strong> This is a rule-based prototype, not a validated crop recommendation.</p>";
    });
  </script>
</body>
</html>
